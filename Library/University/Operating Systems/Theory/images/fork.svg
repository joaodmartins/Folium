<svg xmlns="http://www.w3.org/2000/svg" width="480" height="180" viewBox="0 0 480 180" role="img" aria-label="fork() creates a child process">
  <rect width="480" height="180" rx="12" fill="#f3ede2"/>
  <g font-family="Georgia, serif" font-size="16" text-anchor="middle" fill="#22201c">
    <rect x="40" y="60" width="150" height="60" rx="8" fill="#fffdf9" stroke="#b4532a" stroke-width="2"/>
    <text x="115" y="95">Parent (pid 100)</text>
    <rect x="290" y="20" width="150" height="60" rx="8" fill="#fffdf9" stroke="#b4532a" stroke-width="2"/>
    <text x="365" y="55">Child (pid 101)</text>
    <rect x="290" y="100" width="150" height="60" rx="8" fill="#fffdf9" stroke="#b4532a" stroke-width="2"/>
    <text x="365" y="135">Parent continues</text>
    <text x="240" y="95" font-size="13" fill="#6b665d">fork()</text>
  </g>
  <g stroke="#b4532a" stroke-width="2" fill="none">
    <path d="M190 80 L290 50"/>
    <path d="M190 100 L290 130"/>
  </g>
</svg>
